<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarot in Training</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <h1>Loading...</h1>
    </div>

    <!-- Main Screen -->
    <div id="main-screen" class="hidden">
        <h1>Tarot in Training</h1>
        <div id="bottom-buttons">
            <button id="start-btn">Start</button>
            <button id="shop-btn">Shop</button>
            <button id="settings-btn">Settings</button>
            <button id="stats-btn">Stats</button>
        </div>
    </div>

    <!-- Game Area -->
    <div id="game-area" class="hidden">
        <div id="customer-placeholder">Customer Here</div>

        <!-- Speech Bubble (unchanged) -->
        <div id="speech-bubble" class="hidden">
            <p id="customer-question"></p>
            <button id="start-reading-btn"></button>
        </div>

        <!-- TABLE SCREEN -->
        <div id="table-area" class="hidden">
            <h2>Your 3-Card Reading</h2>
            <div id="spread-container">
                <div class="position"><div class="card-slot" data-index="0">Past</div></div>
                <div class="position"><div class="card-slot" data-index="1">Present</div></div>
                <div class="position"><div class="card-slot" data-index="2">Future</div></div>
            </div>
        </div>

        <!-- Magnified Card (left) -->
        <div id="magnified-area" class="hidden">
            <div id="magnified-card">
                <h3 id="magnified-name"></h3>
                <p id="magnified-orientation"></p>
            </div>
        </div>

        <!-- Interpretation Popup (middle) -->
        <div id="interpretation-popup" class="hidden">
            <h3 id="position-prefix"></h3>
            <div id="interpretation-options"></div>
            <button onclick="closeInterpretation()">Cancel</button>
        </div>
    </div>

    <!-- Modals (unchanged) -->
    <div id="modal-overlay" class="hidden"></div>
    <!-- ... (shop, settings, stats modals stay exactly as before) ... -->
 <script src="cardDatabase.js"></script>
    <script src="script.js"></script>
</body>
</html>
