<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarot in Training</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <h1>Loading...</h1>
    </div>

    <!-- Main Screen -->
    <div id="main-screen" class="hidden">
        <h1>Tarot in Training</h1>
        <div id="bottom-buttons">
            <button id="start-btn">Start</button>
            <button id="shop-btn">Shop</button>
            <button id="settings-btn">Settings</button>
            <button id="stats-btn">Stats</button>
        </div>
    </div>

    <!-- Game Area -->
    <div id="game-area" class="hidden">
        <!-- Customer reference -->
        <div id="customer-placeholder">Customer Appears Here</div>
        
        <!-- Speech Bubble -->
        <div id="speech-bubble" class="hidden">
            <p id="customer-question"></p>
            <button id="start-reading-btn"></button>
        </div>
    </div>

    <!-- NEW: Table Reading Screen (appears after clicking the speech-bubble button) -->
    <div id="table-screen" class="hidden">
        <h2>Your 3-Card Reading</h2>
        <div class="table-slots">
            <div id="slot-1" class="card-slot"></div>
            <div id="slot-2" class="card-slot"></div>
            <div id="slot-3" class="card-slot"></div>
        </div>
    </div>

    <!-- Modals (unchanged) -->
    <div id="modal-overlay" class="hidden"></div>
    <!-- ... (shop, settings, stats modals stay exactly as before) ... -->
 <script src="cardDatabase.js"></script>
    <script src="script.js"></script>
</body>
</html>
